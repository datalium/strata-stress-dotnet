name: A scenario doesn't build, run or match its numbers
description: A scenario fails, a check fails, or what it prints is far from RESULTS.md on a similar machine.
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              For a bug in Strata itself (not in a scenario), please open it in [datalium/strata](https://github.com/datalium/strata/issues/new/choose).
    - type: input
      id: scenario
      attributes:
          label: Which scenario?
          placeholder: e.g. 03-kill-mid-storm
      validations:
          required: true
    - type: textarea
      id: what
      attributes:
          label: What happened?
          description: The command you ran, what you expected, and what you got. Paste the output, and the JSON if there is one.
          render: text
      validations:
          required: true
    - type: input
      id: env
      attributes:
          label: Environment
          description: Your OS, CPU, the .NET SDK version (`dotnet --version`), and how Postgres runs (Docker Desktop, native, ...).
      validations:
          required: true
