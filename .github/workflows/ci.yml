# Builds everything, runs the harness's tests, and runs every scenario with --quick: small sizes that
# prove each scenario still runs and its checks still pass. A quick run measures nothing, so nothing here
# is a benchmark; the JSON is kept as an artifact only to look at.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  stress:
    name: .NET stress
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Postgres and Redis for scenarios 2-4, matching docker-compose.yml (whose max_connections the quick
    # sizes don't need).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strata -d strata"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Strata.Stress.slnx

      - name: Format
        run: dotnet format Strata.Stress.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Strata.Stress.slnx --configuration Release --no-restore

      - name: Test the harness
        run: dotnet test --solution Strata.Stress.slnx --configuration Release --no-build

      - name: Run every scenario with --quick
        run: |
          # No -e: run every scenario, then report all the failures.
          set +e -uo pipefail
          failed=()
          count=0
          for dir in scenarios/[0-9][0-9]-*/; do
            [ -d "$dir" ] || continue
            scenario=$(basename "$dir")
            count=$((count + 1))
            echo "::group::$scenario --quick"
            dotnet run --no-build --configuration Release --project "$dir" -- --quick --json "artifacts/results/$scenario.json"
            code=$?
            echo "::endgroup::"
            [ "$code" -eq 0 ] || { echo "::error::$scenario --quick exited with $code"; failed+=("$scenario"); }
          done
          if [ "$count" -eq 0 ]; then
            echo "::notice::No scenario yet: scenarios/ is empty."
          fi
          if [ ${#failed[@]} -gt 0 ]; then
            printf 'Failed: %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Keep the quick runs' JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-results
          path: artifacts/results/
          if-no-files-found: ignore
