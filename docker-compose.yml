# Throwaway Postgres + Redis for the stress scenarios. Not a deployment recipe: the credentials are
# public and nothing is persisted between runs.
#
#   docker compose up -d --wait
#   dotnet run -c Release --project scenarios/04-durable-firehose
#   docker compose down
#
# The scenarios read STRATA_STRESS_POSTGRES_URL / STRATA_STRESS_REDIS_URL and default to the addresses
# below. datalium/strata, strata-demos-dotnet and strata-demos-rust ship a compose file on the same ports,
# so run only one copy at a time. If something else already holds 5432 or 6379, start the containers on
# other ports and point the two variables at them.
#
# Postgres keeps its data on tmpfs, as datalium/strata's benchmarks did, so the disk doesn't set the pace.
# A full run of scenario 2 (a million suspended threads) leaves about 4.3 GB in it: see its README.
# max_connections is raised from 100 because a scenario's connection pool, at its default size
# of 100, can fill the default on its own; CI's quick runs stay well under it.
services:
    postgres:
        image: postgres:16-alpine
        command: ['postgres', '-c', 'max_connections=300']
        environment:
            POSTGRES_USER: strata
            POSTGRES_PASSWORD: strata
            POSTGRES_DB: strata
        ports:
            - '5432:5432'
        tmpfs:
            - /var/lib/postgresql/data
        shm_size: 1gb
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U strata -d strata']
            interval: 2s
            timeout: 3s
            retries: 30

    # No scenario uses Redis yet (SCENARIOS.md, "Open questions"); it is here so the stores the Strata
    # repositories compare all start from one file.
    redis:
        image: redis:7-alpine
        # No persistence: a fresh, empty Redis every `up`.
        command: ['redis-server', '--save', '', '--appendonly', 'no']
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 2s
            timeout: 3s
            retries: 30

    # The scenarios themselves, on Linux (linux/Dockerfile), for RESULTS.md's Linux figures. Only with its
    # profile: `docker compose run --rm --build linux scenarios/01-burst`. It reaches Postgres on this file's
    # network, not through the host's forwarded port.
    linux:
        profiles: ['linux']
        build:
            context: .
            dockerfile: linux/Dockerfile
        environment:
            STRATA_STRESS_POSTGRES_URL: postgres://strata:strata@postgres:5432/strata
        volumes:
            - ./results:/repo/results
